name: Web UI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - '!web/terraform/**'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'web/**'
      - '!web/terraform/**'
      - '.github/workflows/web.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r web/requirements.txt flake8

      - name: Run linter
        run: flake8 web/app.py --max-line-length 120

  deploy:
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package Lambda deployment
        run: |
          cd web
          pip install -r requirements.txt -t package/
          cp -r templates package/
          cp -r static package/
          cp app.py package/
          cd package
          zip -r ../../payload.zip .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to AWS Lambda
        run: aws lambda update-function-code --function-name CopeAndHopeWebUI --zip-file fileb://payload.zip
