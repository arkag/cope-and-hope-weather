name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Verify formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted properly:"
            gofmt -l .
            exit 1
          fi

      - name: Install golangci-lint from source
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run ./...

      - name: Run tests with race detector
        run: go test -v -race ./...

      - name: Build and Zip for Lambda
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          GOOS=linux GOARCH=amd64 go build -tags lambda.norpc -o bootstrap main.go
          zip payload.zip bootstrap

      - name: Configure AWS Credentials
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to AWS Lambda
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: aws lambda update-function-code --function-name CopeAndHopeWeatherAPI --zip-file fileb://payload.zip

      - name: Wait for Lambda update
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: sleep 5

      - name: Fetch API Gateway URL
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          API_ID=$(aws apigatewayv2 get-apis --region us-east-1 --query "Items[?Name=='CopeAndHopeGateway'].ApiId" --output text)
          echo "API_URL=https://${API_ID}.execute-api.us-east-1.amazonaws.com" >> $GITHUB_ENV

      - name: Run E2E Integration Tests
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          API_ENDPOINT: ${{ env.API_URL }}
        run: go test -v ./e2e
